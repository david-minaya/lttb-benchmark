global:
  scrape_interval: 2s

scrape_configs:
  - job_name: 'lttb-js'
    static_configs:
      - targets: ['lttb-js:9464']
  - job_name: 'downsample-js'
    static_configs:
      - targets: ['downsample-js:9465']
  - job_name: 'lttb-py'
    static_configs:
      - targets: ['lttb-py:9466']
  - job_name: 'lttb-stream-js'
    static_configs:
      - targets: ['lttb-stream-js:9468']
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
